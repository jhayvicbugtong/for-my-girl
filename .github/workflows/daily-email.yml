name: Daily Love Email

on:
  # Main trigger: cron-job.org calls the GitHub API at exactly 9:00 AM UAE
  # with inputs.source = "timer".
  workflow_dispatch:
    inputs:
      source:
        description: 'Leave as "manual" to always send. "timer" = only send if not already sent today.'
        required: false
        default: manual

  # Backup only: GitHub's own scheduler is often hours late or skips days.
  # UAE (Asia/Dubai) is UTC+4 with no daylight saving.
  schedule:
    - cron: '7 5 * * *'   # 9:07 AM UAE
    - cron: '37 6 * * *'  # 10:37 AM UAE

# Never let two runs send at the same time.
concurrency:
  group: daily-email
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  send-email:
    runs-on: ubuntu-latest
    steps:
      - name: Check if today's email was already sent
        id: check
        if: github.event_name == 'schedule' || inputs.source == 'timer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Start of today in UAE time, expressed in UTC
          since=$(date -u -d "$(TZ=Asia/Dubai date +%F) 00:00 +04:00" +%Y-%m-%dT%H:%M:%SZ)
          count=$(gh api "repos/${{ github.repository }}/actions/workflows/daily-email.yml/runs?status=success&created=%3E%3D${since}" --jq '.total_count')
          echo "Successful runs since $since (UAE midnight): $count"
          if [ "$count" -gt 0 ]; then
            echo "Already sent today - skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.skip != 'true'

      - name: Set up Node.js
        if: steps.check.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        if: steps.check.outputs.skip != 'true'
        run: npm install

      - name: Send Daily Email
        if: steps.check.outputs.skip != 'true'
        run: node send-email.js
        env:
          EMAILJS_SERVICE_ID: ${{ secrets.EMAILJS_SERVICE_ID }}
          EMAILJS_TEMPLATE_ID: ${{ secrets.EMAILJS_TEMPLATE_ID }}
          EMAILJS_PUBLIC_KEY: ${{ secrets.EMAILJS_PUBLIC_KEY }}
          EMAILJS_PRIVATE_KEY: ${{ secrets.EMAILJS_PRIVATE_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
